onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma
  - unrs-resolver

overrides:
  # solid-js <1.9.18 pins seroval ~1.5, which has the server-function deserialization flaw (needs >=1.6.8).
  solid-js: 1.9.18
  # Keep one router-core: the devtools and ssr-query peers would otherwise
  # resolve a newer one than the router that react-start pins.
  '@tanstack/router-core': 1.171.35
  '@tanstack/query-core': 5.107.1
  '@tanstack/react-query': 5.107.1
